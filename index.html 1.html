<html>
  <head>
    <title>Calculadora ultra pro max</title>
  </head>
    <body>
<input id="num1" type="number" placeholder="Número 1">
  <input id="num2" type="number" placeholder="Número 2">
  <button onclick="somar()">Somar</button>
  <button onclick="diminuir()">diminuir</button>
  <button onclick="divisão()">divisão</button>
  <button onclick="multiplicação()">multiplicação</button>
  <div id="resultado"></div>
    <script>
    function somar() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      
      if (isNaN(n1) || isNaN(n2)) {
        document.getElementById("resultado").innerHTML = 
          "Por favor, digite números válidos.";
      } else {
        document.getElementById("resultado").innerHTML = 
          "Resultado: " + (n1 + n2);
      }
    }
    function diminuir() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      
      if (isNaN(n1) || isNaN(n2)) {
        document.getElementById("resultado").innerHTML = 
          "Por favor, digite números válidos.";
          
      } else {
        document.getElementById("resultado").innerHTML = 
          "Resultado: " + (n1 - n2);
      }
    }
    function divisão() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      
      if (isNaN(n1) || isNaN(n2)) {
        document.getElementById("resultado").innerHTML = 
          "Por favor, digite números válidos.";
          
      } else {
        document.getElementById("resultado").innerHTML = 
          "Resultado: " + (n1 / n2);
      }
    }
    function multiplicação() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      
      if (isNaN(n1) || isNaN(n2)) {
        document.getElementById("resultado").innerHTML = 
          "Por favor, digite números válidos.";
          
      } else {
        document.getElementById("resultado").innerHTML = 
          "Resultado: " + (n1 * n2);
      }
    }
  </script>
  </head>
</html>
